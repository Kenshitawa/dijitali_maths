---
deployment:
  tasks:
    - export APP_PATH=/home/dijitali/dijitalimaths-app/
    - /bin/mkdir -p $APP_PATH
    - /bin/cp -R dist public prisma package.json package-lock.json images documents $APP_PATH
    - cd $APP_PATH && npm ci --omit=dev && npx prisma generate && npx prisma db push
    - /bin/mkdir -p $APP_PATH/tmp && /usr/bin/touch $APP_PATH/tmp/restart.txt
