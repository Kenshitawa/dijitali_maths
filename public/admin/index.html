<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Admin portal | Dijitali Maths</title>
    <link rel="icon" type="image/jpeg" href="/images/logo.jpeg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/admin/admin-ui.css?v=20261125-inbox-2" />
    <link rel="stylesheet" href="/admin/css/design-system.css" />
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body>
    <!-- React owns the sign-in screen and the admin shell. The legacy forms
         below stay mounted (hidden) so the page engine in admin.js and older
         deep links keep working. -->
    <section id="authView" aria-label="Admin sign in">
      <div id="boardui-auth-root"></div>
    </section>

    <div hidden aria-hidden="true" id="legacyForms">
      <div class="card">
        <div id="loginFormPanel">
          <h1>Welcome back</h1>
          <form id="legacyLoginForm">
            <input name="email" type="email" autocomplete="email" />
            <div class="password-field">
              <input name="password" type="password" autocomplete="current-password" />
            </div>
            <p class="form-status"></p>
            <button type="submit">Sign in</button>
            <button type="button" id="showForgotBtn">Forgot password?</button>
          </form>
        </div>
        <form id="forgotForm">
          <input name="email" type="email" />
          <p class="form-status"></p>
          <button type="submit">Send reset link</button>
          <button type="button" id="backToLoginBtn">Back to sign in</button>
        </form>
        <form id="tokenPasswordForm">
          <h2 id="tokenFormTitle">Set New Password</h2>
          <input id="newPasswordInput" type="password" minlength="12" />
          <p class="form-status"></p>
          <button type="submit">Save password</button>
        </form>
      </div>
    </div>

    <section id="adminShell" class="hidden">
      <div id="boardui-admin-root"></div>
    </section>

    <div id="adminModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="adminModalTitle">
      <div class="modal-box">
        <div class="modal-head">
          <h2 id="adminModalTitle"></h2>
          <button id="adminModalClose" type="button" aria-label="Close dialog">&times;</button>
        </div>
        <div id="adminModalBody"></div>
      </div>
    </div>
    <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>

    <script type="module" src="/admin/admin-ui.js?v=20261125-inbox-2"></script>
    <script src="/admin/admin.js" defer></script>
  </body>
</html>
